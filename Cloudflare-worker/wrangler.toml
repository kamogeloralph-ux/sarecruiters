name = "sarecruiters-uploader"
main = "worker.js"
compatibility_date = "2026-09-08"
# Required by @sentry/cloudflare (AsyncLocalStorage).
compatibility_flags = ["nodejs_compat"]

# Secrets RESEND_API_KEY / TURNSTILE_SECRET_KEY are synced from GitHub
# Actions secrets AFTER every deploy (see deploy-worker.yml). This flag also
# keeps any dashboard-set Variables/Secrets. Previously set:
# IMPORTANT: keep dashboard-set Variables/Secrets (RESEND_API_KEY,
# TURNSTILE_SECRET_KEY, TURNSTILE_SITE_KEY) across CI deploys. Without this,
# every `wrangler deploy` DELETES bindings that are not declared in this
# file — which silently wiped the dashboard secrets on every push.
keep_vars = true

[[r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "sarecruiters-media"

[[d1_databases]]
binding = "DB"
database_name = "sarecruiters-d1"
database_id = "7d1a4327-6056-45cf-ae62-b5b26a454627"

# Keeps the D1 write mirror of agencies/branches/vacancies/employers/pool_candidates
# fresh for admin and operational recovery. Public startup, vacancy, poster, and
# house-ad reads use R2 snapshots and edge caching; they never fall back to D1 or
# Supabase, so public traffic cannot exhaust the account-wide D1 read budget or
# create uncontrolled Supabase egress. The
# mirror upserts changed rows in batches and reconciles stale keys once daily.
# Use POST /api/sync-d1 after an important admin data change if an immediate
# mirror refresh is needed.
#
# Second schedule: the watchdog (watchdog.js) -- every 30 minutes, offset from the
# 6-hourly tick. It restarts stale/disabled GitHub workflows, backs up the TipChat
# Autopilot sweep if pg_cron stalls, and emails only when self-healing fails.
[triggers]
crons = ["0 */6 * * *", "15,45 * * * *", "0 7 1 * *"]


# Sampled request logs (10%) so Workers & Pages -> this Worker -> Observability
# shows which paths and IPs generate traffic. Raise/lower head_sampling_rate as needed.
[observability]
enabled = true
head_sampling_rate = 1

[vars]
# Sentry DSN is public by design (ingest-only), safe to commit.
SENTRY_DSN = "https://974882cc5071d5e89fef69bbfa138365@o4512413276831744.ingest.de.sentry.io/4512413289807952"
SUPABASE_URL = "https://ythznnktswgymerdcxky.supabase.co"
SUPABASE_ANON_KEY = "sb_publishable_PU5_htQ0UZQoMrD6aY3rVQ_tzE3ztjH"
# Must use the verified sa-recruiters.co.za Resend domain so notification
# emails can reach recipients other than the Resend account owner.
EMAIL_FROM = "SA Recruiters <notifications@sa-recruiters.co.za>"
# Must remain false until the owner approves the exact campaign copy.
AGENCY_VACANCY_OUTREACH_ENABLED = "false"
# Enable public access on this bucket in the Cloudflare dashboard first
# (R2 -> sarecruiters-media -> Settings -> Public Access), then use that
# URL here. Already confirmed working:
R2_PUBLIC_BASE_URL = "https://media.sa-recruiters.co.za"
SITE_URL = "https://sa-recruiters.co.za"
WORKER_URL = "https://sarecruiters-uploader.kamogeloralph.workers.dev"
CV_DOWNLOAD_PRICE_CENTS = "4900"
#
# WATCHDOG settings (all optional; each unlocks one more self-healing check):
#   SITE_URL              default https://sa-recruiters.co.za
#   GITHUB_REPO           "owner/repo" of this project. Enables workflow self-healing.
#   GITHUB_BRANCH         default main
#   WATCHDOG_GH_TOKEN     SECRET: fine-grained GitHub token, this repo only,
#                         permission "Actions: Read and write". Without it the
#                         watchdog still checks the site, D1 sync and Autopilot.
#   HEALTHCHECK_PING_URL  SECRET/var: a healthchecks.io-style ping URL, called every
#                         run, so an outside service emails you if the watchdog dies.
#   OPS_ALERT_EMAIL       who receives alerts (falls back to ADMIN_NOTIFY_EMAIL).
#
# OPTIONAL non-secret settings — configure these as Worker variables if you
# need to change the defaults:
#   ADMIN_NOTIFY_EMAIL  default: sarecruiters.directory@gmail.com
#   EMAIL_FROM          defaults to notifications@sa-recruiters.co.za
#
# SECRET settings (never put real values in this file) — required for the
# new spam/email/manager-link features. Set each with:
#   cd Cloudflare-worker && npx wrangler secret put <NAME>
#
#   RESEND_API_KEY        Resend API key (re_...) — enables all server-side
#                         notification emails.
#   TURNSTILE_SECRET_KEY  Turnstile secret key (0x4AAA...) — enables spam
#                         checks on /api/submit/* endpoints. The matching
#                         SITE key goes in app-sheets.js (TURNSTILE_SITE_KEY).
#   GEMINI_API_KEY        Google Gemini API key — powers the CV Builder
#                         (/api/generate-cv, in the CV Revamp Service).
#                         Get one at https://aistudio.google.com/apikey
#                         Optional: GEMINI_MODEL to override the default
#                         model (gemini-2.5-flash) as a plain Variable.
#
#   More Gemini features (see ../AI-FEATURES.md). All optional plain Variables:
#   GEMINI_PAID_TIER=1    Say "1" ONLY once the Gemini key is on a paid plan that does not
#                         train on your data. Until then CV feedback and photo checks stay
#                         OFF (POPIA). Poster reading, scam checks, search and summaries
#                         do not read personal CVs and are not blocked.
#   AI_DAILY_CAP          Max Gemini calls per day, all features together (default 1000).
#   AI_CLEAN_LIMIT        Scraped vacancies tidied per daily run (default 100, 10 per call).
#   AI_SCREEN_LIMIT       New vacancies scam-screened per daily run (default 60; most are
#                         decided by rules with no Gemini call).
#   AI_COMMUNITY_LIMIT    Recent TipChat posts re-checked per daily run (default 40; needs
#                         the SUPABASE_SERVICE_ROLE_KEY secret already used for account deletion).
#
# If TURNSTILE_SECRET_KEY is unset, /api/submit/* fail closed with 503 —
# set it (or deploy without using the new submit endpoints; the app's
# legacy fallbacks still work). See ../SECURITY_SETUP.md.
#
# The matching PUBLIC site key lives in ../app-sheets.js (TURNSTILE_SITE_KEY)
# and is also saved as a plain Variable in the dashboard. Secrets set in the
# dashboard (RESEND_API_KEY, TURNSTILE_SECRET_KEY) are picked up by the next
# deployment — push any Cloudflare-worker/** change (or re-run the workflow)
# after rotating them.
