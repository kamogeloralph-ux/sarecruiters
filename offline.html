<!DOCTYPE html>
<html lang="en-ZA">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Offline — SA Recruiters</title>
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="/icons/favicon.ico" sizes="48x48">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<style>
  *{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Inter',sans-serif}
  html,body{height:100%}
  body{background:#000;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:2rem;-webkit-font-smoothing:antialiased}
  .logo{width:96px;height:96px;border-radius:24px;overflow:hidden;margin-bottom:24px;box-shadow:0 10px 40px -12px rgba(10,132,255,.5)}
  .logo img{width:100%;height:100%;display:block}
  h1{font-size:26px;font-weight:800;letter-spacing:-.02em;margin-bottom:10px}
  p{color:#8E8E93;font-size:15px;line-height:1.55;max-width:420px;margin-bottom:26px}
  .btn{display:inline-flex;align-items:center;gap:8px;background:#0A84FF;color:#fff;border:none;border-radius:999px;padding:14px 28px;font-size:15px;font-weight:700;cursor:pointer;transition:transform .15s,opacity .2s}
  .btn:active{transform:scale(.96)}
  .btn svg{width:18px;height:18px}
  .hint{margin-top:34px;font-size:12px;color:#48484A;max-width:360px}
</style>
</head>
<body>
  <div class="logo"><img src="/icons/icon-512.png" alt="SA Recruiters"></div>
  <h1>You're offline</h1>
  <p>SA Recruiters needs an internet connection to load the latest agencies, branches and vacancies. Please check your network and try again.</p>
  <button class="btn" onclick="retry()">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 4v6h-6"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
    Try again
  </button>
  <p class="hint">Any agencies and pages you have already visited are still available from your cached copy.</p>
  <script>
    function retry(){ location.href = '/'; }
    window.addEventListener('online', function(){ location.href = '/'; });
  </script>
</body>
</html>
