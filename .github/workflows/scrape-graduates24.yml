name: Scrape Graduates24 learnerships
on:
  schedule:
    # Offset from every other scraper's minute (17/27/37/47/30/7) so none
    # of them queue for the same GitHub-hosted runner minute.
    - cron: "57 */6 * * *"
  workflow_dispatch:
    inputs:
      pages:
        description: "Override GRADUATES24_PAGES for this run only"
        required: false
        default: ""
        type: string
permissions:
  contents: read
concurrency:
  group: graduates24-scraper
  cancel-in-progress: false
jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      GRADUATES24_PAGES: ${{ inputs.pages || vars.GRADUATES24_PAGES }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Scrape Graduates24 learnership postings
        run: npm run scrape:graduates24
