name: Map Pnet agency URLs

on:
  schedule:
    # Run discovery daily; only strict high-confidence matches are applied.
    - cron: "23 2 * * *"
  workflow_dispatch:
    inputs:
      apply:
        description: "Apply high-confidence mappings (95%+)"
        required: false
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: pnet-agency-mapper
  cancel-in-progress: false

jobs:
  map:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      PNET_AUTO_APPLY_THRESHOLD: "0.95"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Discover and apply safe agency mappings
        if: ${{ github.event_name == 'schedule' || inputs.apply }}
        run: npm run map:pnet -- --output pnet-agency-mapping.json --apply
      - name: Discover agency mappings without applying them
        if: ${{ github.event_name == 'workflow_dispatch' && !inputs.apply }}
        run: npm run map:pnet -- --output pnet-agency-mapping.json
      - name: Upload mapping report for manual review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pnet-agency-mapping-report
          path: pnet-agency-mapping.json
          if-no-files-found: warn
          retention-days: 30
