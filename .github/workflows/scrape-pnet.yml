name: Scrape Pnet vacancies

on:
  schedule:
    # General vacancies run every time; one agency then rotates oldest-first.
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      batch_size:
        description: "Number of agencies to scrape in this run"
        required: false
        default: "1"
        type: string

permissions:
  contents: read

concurrency:
  group: pnet-scraper
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SCRAPE_BATCH_SIZE: ${{ inputs.batch_size || '1' }}
      SCRAPE_REQUEST_TIMEOUT_MS: "60000"
      SCRAPE_FETCH_ATTEMPTS: "2"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Scrape general and oldest-scraped agency vacancies from fixed Pnet URLs
        run: npm run scrape:pnet
