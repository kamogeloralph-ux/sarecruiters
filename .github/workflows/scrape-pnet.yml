name: Scrape Pnet agency vacancies
on:
  schedule:
    # Offset from the other scrapers so jobs never queue for the same
    # GitHub-hosted runner minute.
    - cron: "7 */6 * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pnet-scraper
  cancel-in-progress: false
jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      PNET_REQUEST_TIMEOUT_MS: "30000"
      PNET_FETCH_ATTEMPTS: "2"
      PNET_MAX_PAGES: "5"
      PNET_DISCOVERY_BATCH: "15"
      PNET_SCRAPE_BATCH: "25"
      PNET_REQUEST_DELAY_MS: "1200"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Discover and scrape agency vacancies on Pnet
        run: npm run scrape:pnet
