name: Sync Adzuna vacancies

on:
  schedule:
    # Offset from Pnet ("17 */6") and CareerJunction ("47 3,9,15,21") so all
    # three never queue for the same runner minute. Free tier allows 250
    # calls/day; 4 runs x 3 pages = 12 calls/day, well inside that.
    - cron: "27 1,7,13,19 * * *"
  workflow_dispatch:
    inputs:
      pages:
        description: "Number of result pages to sync in this run"
        required: false
        default: "3"
        type: string

permissions:
  contents: read

concurrency:
  group: adzuna-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
      ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
      ADZUNA_PAGES: ${{ inputs.pages || '3' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Sync vacancies from the Adzuna API
        run: npm run sync:adzuna
