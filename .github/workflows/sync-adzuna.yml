name: Sync Adzuna vacancies

on:
  schedule:
    # Twice weekly: Monday and Friday at 03:27 UTC.
    - cron: "27 3 * * 1,5"
  workflow_dispatch:
    inputs:
      pages:
        description: "Number of result pages to sync in this run"
        required: false
        default: "3"
        type: string

permissions:
  contents: read

concurrency:
  group: adzuna-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
      ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
      ADZUNA_PAGES: ${{ inputs.pages || '3' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Sync vacancies from the Adzuna API
        run: npm run sync:adzuna
