name: Verify stored vacancy links (all sources)
on:
  schedule:
    # Offset by 30 minutes from scrape-jobmail.yml's "17 */6 * * *" so the
    # two never run in the same window against the same rows. The verifier
    # now covers every scraped/synced source (not just JobMail), so it also
    # deletes rows that are stale by freshness rules (past closing date /
    # older than the source's max posting age) before spending a request
    # on their URL.
    - cron: "47 */6 * * *"
  workflow_dispatch:
    inputs:
      batch:
        description: "How many stored links to re-check this run"
        required: false
        default: "250"
        type: string
permissions:
  contents: read
concurrency:
  group: jobmail-link-verifier
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    # Worst case (a run of mostly-timing-out third-party sites) is
    # BATCH_SIZE * (REQUEST_TIMEOUT_MS + REQUEST_DELAY_MS); 25 minutes
    # gives real headroom over the ~19-minute worst case at the defaults
    # without being able to run away indefinitely on a bad day.
    timeout-minutes: 25
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      JOBMAIL_VERIFY_BATCH: ${{ inputs.batch || '250' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Re-check stored vacancy links and freshness
        run: npm run verify:jobmail
