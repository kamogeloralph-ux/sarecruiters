name: Sync Oracle careers-site vacancies (Mr Price, TFG)
on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:
    inputs:
      only:
        description: "Only sync these sources, comma separated (mrprice, tfg). Leave empty for all."
        type: string
        default: ""
      dry_run:
        description: "Dry run (fetch and print only, write nothing)"
        type: boolean
        default: false
      debug_raw:
        description: "Print the first raw API payloads (use if the API shape changes)"
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: oracle-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      ORACLE_ONLY: ${{ inputs.only }}
      DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
      DEBUG_RAW: ${{ inputs.debug_raw && '1' || '' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Sync Oracle careers feeds
        run: npm run sync:oracle
