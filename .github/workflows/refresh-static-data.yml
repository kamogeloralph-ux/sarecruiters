name: Refresh static job data

on:
  schedule:
    # Twice daily so source changes reach the app promptly.
    - cron: "30 3,15 * * *"
  workflow_dispatch:
    inputs:
      years:
        description: "Government publication years to scan"
        required: false
        default: "2026"
        type: string

permissions:
  contents: write

concurrency:
  group: refresh-static-data
  cancel-in-progress: false

env:
  NODE_VERSION: "22"
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
  ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
  ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
  RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
  OPS_ALERT_EMAIL: ${{ secrets.OPS_ALERT_EMAIL }}
  EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
  GOVERNMENT_YEARS: ${{ inputs.years || '2026' }}
  GOVERNMENT_MAX_CIRCULAR: "60"
  ADZUNA_PAGES: "3"
  HIMALAYAS_PAGES: "5"
  GRADUATES24_PAGES: "10"
  SIMPLIFY_MAX_PAGES: "100"
  SIMPLIFY_PAGE_SIZE: "100"
  SIMPLIFY_REQUEST_DELAY_MS: "750"
  CAREERS_PAGE_ONLY: ""
  ORACLE_ONLY: ""
  RETAIL_PAGE_SIZE: "20"
  RETAIL_DETAIL_CONCURRENCY: "4"
  INDEED_ENABLED: ${{ vars.INDEED_ENABLED }}

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install PDF text extraction
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Restore scraper failure history
        uses: actions/cache/restore@v4
        with:
          path: .scraper-state
          key: scraper-state-none
          restore-keys: scraper-state-
      - name: Run source scrapers
        shell: bash
        run: |
          set -uo pipefail
          : > failed-sources.txt
          run_source() {
            local name="$1"; shift
            echo "--- running $name ($*) ---"
            if ! "$@"; then
              echo "Source failed but refresh will continue: $name" >&2
              echo "$name" >> failed-sources.txt
            fi
          }
          run_source adzuna npm run sync:adzuna
          # Indeed's public RSS feed no longer works (it has never produced a row),
          # so it is off by default. Set repository variable INDEED_ENABLED=true to retry it.
          if [ "${INDEED_ENABLED:-}" = "true" ]; then run_source indeed npm run sync:indeed; fi
          run_source himalayas npm run sync:himalayas
          run_source oracle npm run sync:oracle
          run_source government npm run sync:government
          run_source retail npm run scrape:retail
          run_source simplify npm run scrape:simplify
          run_source graduates24 npm run scrape:graduates24
          run_source careers-page npm run scrape:careers-page
      # Public inventory is mirrored by the scheduled Cloudflare Worker into
      # D1 and published to R2. Do not export or commit a full Supabase table
      # snapshot from Actions; browsers no longer serve that artifact.
      - name: Report persistent scraper failures
        if: always()
        continue-on-error: true
        run: node scripts/scraper-failure-report.mjs
      - name: Save scraper failure history
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .scraper-state
          key: scraper-state-${{ github.run_id }}
