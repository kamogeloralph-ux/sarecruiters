name: Deploy static site to Cloudflare

on:
  push:
    branches: [main]
    paths-ignore:
      - 'Cloudflare-worker/**'
      - 'scripts/**'
      - 'supabase/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-site
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    name: Deploy sarecruiters-site
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Deploy site with Wrangler
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config wrangler-site.toml
