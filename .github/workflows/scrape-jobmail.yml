name: Scrape Job Mail vacancies
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      pages:
        description: "Number of Job Mail result pages to scrape"
        required: false
        default: "3"
        type: string
permissions:
  contents: read
concurrency:
  group: jobmail-scraper
  cancel-in-progress: false
jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      JOBMAIL_PAGES: ${{ inputs.pages || '3' }}
      JOBMAIL_REQUEST_TIMEOUT_MS: "60000"
      JOBMAIL_FETCH_ATTEMPTS: "2"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Scrape Job Mail result pages
        run: npm run scrape:jobmail
