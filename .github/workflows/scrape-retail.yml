name: Scrape retail vacancies
on:
  schedule:
    - cron: "47 */6 * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: retail-scraper
  cancel-in-progress: false
jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      RETAIL_PAGE_SIZE: "20"
      RETAIL_DETAIL_CONCURRENCY: "4"
      RETAIL_REQUEST_TIMEOUT_MS: "60000"
      RETAIL_FETCH_ATTEMPTS: "2"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Scrape retailer career feeds
        run: npm run scrape:retail
