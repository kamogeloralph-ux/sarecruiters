name: Android build

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: Build variant
        required: true
        default: debug
        type: choice
        options:
          - debug
          - release
      sign_release:
        description: Sign the release APK with Android repository secrets
        required: true
        default: false
        type: boolean
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android-build.yml"

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  CAPACITOR_VERSION: "8.5.2"
  CAPACITOR_APP_VERSION: "8.1.2"
  CAPACITOR_CAMERA_VERSION: "8.2.5"
  CAPACITOR_PUSH_VERSION: "8.1.3"
  BIOMETRIC_AUTH_VERSION: "10.0.0"
  BUILD_TYPE: ${{ inputs.build_type || 'debug' }}
  SIGN_RELEASE: ${{ inputs.sign_release || 'false' }}

jobs:
  build:
    name: Build Android ${{ inputs.build_type || 'debug' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install web and Capacitor dependencies
        run: |
          npm ci
          npm install --no-save --ignore-scripts \
            "@capacitor/core@${CAPACITOR_VERSION}" \
            "@capacitor/android@${CAPACITOR_VERSION}" \
            "@capacitor/app@${CAPACITOR_APP_VERSION}" \
            "@capacitor/camera@${CAPACITOR_CAMERA_VERSION}" \
            "@capacitor/push-notifications@${CAPACITOR_PUSH_VERSION}" \
            "@aparajita/capacitor-biometric-auth@${BIOMETRIC_AUTH_VERSION}"

      - name: Validate release signing configuration
        if: env.BUILD_TYPE == 'release' && env.SIGN_RELEASE == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for variable in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [[ -z "${!variable}" ]]; then
              echo "Missing required repository secret: ${variable}" >&2
              exit 1
            fi
          done

      - name: Build debug APK
        if: env.BUILD_TYPE == 'debug'
        working-directory: android
        run: ./gradlew --no-daemon --stacktrace :app:assembleDebug

      - name: Build unsigned release APK
        if: env.BUILD_TYPE == 'release'
        working-directory: android
        run: ./gradlew --no-daemon --stacktrace :app:assembleRelease

      - name: Sign release APK
        if: env.BUILD_TYPE == 'release' && env.SIGN_RELEASE == 'true'
        working-directory: android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          build_tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > app/release.keystore
          unsigned="app/build/outputs/apk/release/app-release-unsigned.apk"
          aligned="app/build/outputs/apk/release/app-release-aligned.apk"
          signed="app/build/outputs/apk/release/app-release.apk"
          "$build_tools/zipalign" -p -f 4 "$unsigned" "$aligned"
          "$build_tools/apksigner" sign \
            --ks app/release.keystore \
            --ks-pass "pass:$ANDROID_KEYSTORE_PASSWORD" \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --key-pass "pass:$ANDROID_KEY_PASSWORD" \
            --out "$signed" \
            "$aligned"
          "$build_tools/apksigner" verify --verbose "$signed"
          rm -f app/release.keystore "$aligned" "$unsigned"

      - name: Prepare APK artifact
        run: |
          set -euo pipefail
          mkdir -p dist
          if [[ "$BUILD_TYPE" == "debug" ]]; then
            cp android/app/build/outputs/apk/debug/app-debug.apk dist/sa-recruiters-debug.apk
          elif [[ "$SIGN_RELEASE" == "true" ]]; then
            cp android/app/build/outputs/apk/release/app-release.apk dist/sa-recruiters-release.apk
          else
            cp android/app/build/outputs/apk/release/app-release-unsigned.apk dist/sa-recruiters-release-unsigned.apk
          fi
          sha256sum dist/*.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: sa-recruiters-android-${{ env.BUILD_TYPE }}-${{ github.run_number }}
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 14
