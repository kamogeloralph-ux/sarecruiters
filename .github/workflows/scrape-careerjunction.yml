name: Scrape CareerJunction vacancies

on:
  schedule:
    # Offset from the Pnet scraper's "17 */6" schedule so the two jobs never
    # queue for the same GitHub-hosted runner minute.
    - cron: "47 3,9,15,21 * * *"
  workflow_dispatch:
    inputs:
      pages:
        description: "Number of result pages to scrape in this run"
        required: false
        default: "3"
        type: string

permissions:
  contents: read

concurrency:
  group: careerjunction-scraper
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      CAREERJUNCTION_PAGES: ${{ inputs.pages || '3' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Scrape CareerJunction's public "all jobs" results pages
        run: npm run scrape:careerjunction
