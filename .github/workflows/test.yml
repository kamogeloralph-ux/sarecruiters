name: Test
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Worker dependencies
        # Tests such as ats-feed.test.mjs and ats-sync.test.mjs import Cloudflare-worker/worker.js,
        # which needs @sentry/cloudflare. The root lockfile does not include it, so without this
        # step those imports fail with ERR_MODULE_NOT_FOUND.
        working-directory: Cloudflare-worker
        run: npm install --no-audit --no-fund
      - name: Run test suite
        run: npm test
