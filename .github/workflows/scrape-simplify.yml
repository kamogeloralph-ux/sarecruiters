name: Scrape Simplify Jobs vacancies

on:
  schedule:
    # Twice weekly: Tuesday and Saturday at 03:47 UTC.
    - cron: "47 3 * * 2,6"
  workflow_dispatch:
    inputs:
      max_pages:
        description: "Maximum central-directory pages to fetch"
        required: false
        default: "100"
        type: string
      page_size:
        description: "Listings per central-directory page (10, 20, 50, or 100)"
        required: false
        default: "100"
        type: string

permissions:
  contents: read

concurrency:
  group: simplify-scraper
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SIMPLIFY_MAX_PAGES: ${{ inputs.max_pages || '100' }}
      SIMPLIFY_PAGE_SIZE: ${{ inputs.page_size || '100' }}
      SIMPLIFY_REQUEST_DELAY_MS: "750"
      SIMPLIFY_REQUEST_TIMEOUT_MS: "30000"
      SIMPLIFY_FETCH_ATTEMPTS: "2"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Scrape all current Simplify company-subdomain listings
        run: npm run scrape:simplify
