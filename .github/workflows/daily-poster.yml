name: Vacancy poster of the day
on:
  schedule:
    - cron: "0 5 * * *"   # 05:00 UTC = 07:00 South Africa
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: daily-poster
  cancel-in-progress: false
jobs:
  poster:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: sudo apt-get update && sudo apt-get install -y fonts-dejavu-core
      - run: pip install pillow
      - run: npm ci
      - run: node scripts/generate-daily-poster.mjs
      # The poster is NOT added to the Vacancy Posters feed; download it from
      # the run's "Artifacts" section.
      - uses: actions/upload-artifact@v4
        with:
          name: poster-of-the-day
          path: tmp-posters/*.jpg
          if-no-files-found: ignore
          retention-days: 14
