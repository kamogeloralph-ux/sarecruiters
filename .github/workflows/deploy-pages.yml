name: Deploy Cloudflare Pages

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "app-*.js"
      - "app.bundle.min.js"
      - "styles.css"
      - "vendor/**"
      - "icons/**"
      - "data/**"
      - "generate-pages.js"
      - "scripts/bundle-app.js"
      - "scripts/verify-critical-globals.js"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: deploy-cloudflare-pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy sarecruiters Pages
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend bundle and static pages
        run: node generate-pages.js

      - name: Validate Cloudflare credentials
        shell: bash
        run: |
          set -euo pipefail
          for variable in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            if [[ -z "${!variable}" ]]; then
              echo "Missing required repository secret: ${variable}" >&2
              exit 1
            fi
          done

      - name: Deploy to Cloudflare Pages
        run: npx --yes wrangler@4.147.0 pages deploy . --project-name=sarecruiters --branch=main
