name: Deploy Cloudflare Worker

on:
  push:
    branches: [main]
    paths:
      - 'Cloudflare-worker/**'
      - '.github/workflows/deploy-worker.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-worker
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    name: Deploy sarecruiters-uploader
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Deploy Worker with Wrangler
        # wrangler.toml sets keep_vars = true, so dashboard-set secrets
        # survive this deploy instead of being deleted.
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: Cloudflare-worker
          command: deploy --config wrangler.toml

      - name: Sync Worker secrets (RESEND + TURNSTILE) if provided
        # Optional override path: add RESEND_API_KEY / TURNSTILE_SECRET_KEY
        # under repo Settings → Secrets and variables → Actions and they
        # are applied AFTER the deploy (so nothing can wipe them). Skipped
        # cleanly when not configured. Without this, the dashboard-set
        # secrets (kept by keep_vars) are what the Worker uses.
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
        working-directory: Cloudflare-worker
        run: |
          if [ -z "$RESEND_API_KEY" ] && [ -z "$TURNSTILE_SECRET_KEY" ]; then
            echo "No RESEND_API_KEY / TURNSTILE_SECRET_KEY in Actions secrets — skipping (dashboard secrets kept by keep_vars)."
            exit 0
          fi
          [ -n "$RESEND_API_KEY" ] && echo "$RESEND_API_KEY" | npx wrangler secret put RESEND_API_KEY
          [ -n "$TURNSTILE_SECRET_KEY" ] && echo "$TURNSTILE_SECRET_KEY" | npx wrangler secret put TURNSTILE_SECRET_KEY
