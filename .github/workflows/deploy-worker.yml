name: Deploy Cloudflare Worker

on:
  push:
    branches: [main]
    paths:
      - "Cloudflare-worker/**"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-cloudflare-worker
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy sarecruiters-uploader
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate Cloudflare credentials
        shell: bash
        run: |
          set -euo pipefail
          for variable in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            if [[ -z "${!variable}" ]]; then
              echo "Missing required repository secret: ${variable}" >&2
              exit 1
            fi
          done

      - name: Deploy Worker
        working-directory: Cloudflare-worker
        run: npx --yes wrangler@4.147.0 deploy --config wrangler.toml

      - name: Apply remote D1 migrations when quota permits
        continue-on-error: true
        working-directory: Cloudflare-worker
        run: |
          if ! npx --yes wrangler@4.147.0 d1 migrations apply sarecruiters-d1 --remote --config wrangler.toml; then
            echo "D1 migration was not applied. The Worker has a cached Supabase fallback and will retry on the next deployment."
          fi
