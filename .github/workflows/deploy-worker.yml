name: Deploy Cloudflare Worker

on:
  push:
    branches: [main]
    paths:
      - "Cloudflare-worker/**"
      - "assets/house-ads/**"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-cloudflare-worker
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy sarecruiters-uploader
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate Cloudflare credentials
        shell: bash
        run: |
          set -euo pipefail
          for variable in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            if [[ -z "${!variable}" ]]; then
              echo "Missing required repository secret: ${variable}" >&2
              exit 1
            fi
          done

      - name: Install Worker dependencies
        working-directory: Cloudflare-worker
        run: npm install --no-audit --no-fund

      - name: Apply remote D1 migrations
        id: d1_migrate
        # The Worker still deploys if this step fails (e.g. D1 quota), but the
        # final step below turns the whole run red so the failure is never silent.
        continue-on-error: true
        working-directory: Cloudflare-worker
        shell: bash
        run: |
          set -o pipefail
          npx --yes wrangler@4.147.0 d1 migrations apply sarecruiters-d1 --remote --config wrangler.toml 2>&1 | tee /tmp/d1-migrate.log

      - name: Deploy Worker
        working-directory: Cloudflare-worker
        run: npx --yes wrangler@4.147.0 deploy --config wrangler.toml

      - name: Sync Supabase service-role key to the Worker
        working-directory: Cloudflare-worker
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${SUPABASE_SERVICE_ROLE_KEY}" ]]; then
            echo "::warning::GitHub secret SUPABASE_SERVICE_ROLE_KEY is empty; the Worker's admin data endpoints will stay disabled."
            exit 0
          fi
          printf '%s' "${SUPABASE_SERVICE_ROLE_KEY}" | npx --yes wrangler@4.147.0 secret put SUPABASE_SERVICE_ROLE_KEY --config wrangler.toml

      - name: Sync Adzuna credentials to the Worker
        # /api/jobs/adzuna (find-jobs) reads these from the Worker, not from GitHub.
        working-directory: Cloudflare-worker
        env:
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${ADZUNA_APP_ID}" || -z "${ADZUNA_APP_KEY}" ]]; then
            echo "::warning::GitHub secrets ADZUNA_APP_ID / ADZUNA_APP_KEY are empty; /api/jobs/adzuna will answer 503 unless they are set on the Worker."
            exit 0
          fi
          printf '%s' "${ADZUNA_APP_ID}" | npx --yes wrangler@4.147.0 secret put ADZUNA_APP_ID --config wrangler.toml
          printf '%s' "${ADZUNA_APP_KEY}" | npx --yes wrangler@4.147.0 secret put ADZUNA_APP_KEY --config wrangler.toml

      - name: Publish house-ad creatives to R2
        shell: bash
        run: |
          set -euo pipefail
          for file in assets/house-ads/*; do
            [[ -f "$file" ]] || continue
            key="assets/house-ads/$(basename "$file")"
            case "$file" in
              *.html|*.htm) content_type="text/html; charset=utf-8" ;;
              *.png) content_type="image/png" ;;
              *.jpg|*.jpeg) content_type="image/jpeg" ;;
              *) continue ;;
            esac
            npx --yes wrangler@4.147.0 r2 object put "sarecruiters-media/$key" --file="$file" --content-type="$content_type" --remote --config=Cloudflare-worker/wrangler.toml
          done

      - name: Fail the run if D1 migrations did not apply
        if: steps.d1_migrate.outcome == 'failure'
        shell: bash
        run: |
          reason="$(tail -n 12 /tmp/d1-migrate.log 2>/dev/null | tr '\n' ' ' | cut -c1-900)"
          echo "::error title=D1 migration error::${reason:-no output captured}"
          echo "::error title=D1 migrations NOT applied::The Worker was deployed, but new D1 tables/columns were not created. Re-run this workflow (often a D1 quota limit), or run: cd Cloudflare-worker && npx wrangler d1 migrations apply sarecruiters-d1 --remote"
          exit 1
