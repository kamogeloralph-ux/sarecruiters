<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>House Ad — Rolaz Electrical</title>
<style>
:root{
  --bg:#000000; --bg-edge:#050505; --card:#1C1C1E; --card-2:#2C2C2E; --card-3:#3A3A3C;
  --text:#FFFFFF; --text-2:#8E8E93; --text-3:#48484A;
  --border:rgba(255,255,255,.08); --border-strong:rgba(255,255,255,.14);
  --accent:#6C5DFF; --accent-soft:rgba(108,93,255,.20);
  --radius:22px; --radius-sm:14px; --radius-pill:999px;
  --shadow-sm:0 2px 14px rgba(0,0,0,.32);
}
:root[data-theme="light"]{
  --bg:#F2F2F7; --bg-edge:#E5E5EA; --card:#FFFFFF; --card-2:#F2F2F7; --card-3:#E5E5EA;
  --text:#000000; --text-2:#8E8E93; --text-3:#C7C7CC;
  --border:rgba(0,0,0,.08); --border-strong:rgba(0,0,0,.14);
  --shadow-sm:0 2px 14px rgba(0,0,0,.08);
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",Segoe UI,Roboto,Helvetica,Arial,sans-serif;
  padding:20px 14px 60px; min-height:100%;
}
.wrap{max-width:420px;margin:0 auto}
.topbar{display:flex;align-items:center;justify-content:space-between;margin:4px 0 22px}
.topbar h1{font-size:15px;font-weight:800;margin:0;letter-spacing:-.01em}
.theme-btn{font-size:12px;font-weight:700;color:var(--text);background:var(--card);border:1px solid var(--border);border-radius:var(--radius-pill);padding:8px 14px;cursor:pointer}
.section-label{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--text-2);margin:26px 2px 10px}

/* ---- real site rule: house-ad-card (exact copy) ---- */
.house-ad-slot{width:auto;margin:0 0 14px}
.house-ad-card{display:flex;flex-direction:column;align-items:stretch;width:100%;margin:0 0 14px;overflow:hidden;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-sm);text-decoration:none;color:var(--text)}
.house-ad-heading{order:1;display:flex;align-items:center;justify-content:center;min-height:44px;padding:10px 14px 7px;background:var(--card);text-align:center}
.house-ad-heading strong{display:block;width:100%;font-size:13.5px;font-weight:780;line-height:1.2;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.house-ad-card img{order:2;display:block;width:100%;height:auto;aspect-ratio:3 / 1;object-fit:cover;object-position:center;border-radius:0}
.house-ad-message{order:3;display:flex;align-items:center;min-height:36px;padding:7px 14px 9px;background:var(--card);text-align:left}
.house-ad-message small{display:block;width:100%;font-size:11.5px;font-weight:400;line-height:1.25;color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:left}
</style>
</head>
