<style>
  /* ---- EDIT THESE ---- */
  :root{
    --bg:#000000;      /* background */
    --accent:#FFFFFF;  /* highlight + button */
    --text:#FFFFFF;
    --muted:#A6A6A6;
    --btn-text:#000000;
  }
  /* -------------------- */
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg)}
  body{font-family:"Trebuchet MS","Segoe UI",Arial,sans-serif}
  #ad{
    position:absolute;left:0;top:0;display:block;width:400px;height:50px;transform-origin:0 0;
    background:var(--bg);color:var(--text);text-decoration:none;overflow:hidden;cursor:pointer;
  }
  .frame{position:absolute;inset:0;opacity:0;display:flex;flex-direction:column;justify-content:center}
  .hl{background:var(--accent);color:var(--btn-text);padding:0 .14em;border-radius:.12em;-webkit-box-decoration-break:clone;box-decoration-break:clone}
  .bar{position:absolute;left:0;top:0;width:4px;height:100%;background:var(--accent);
       transform:scaleY(0);transform-origin:top;animation:bar 1s .1s ease-out forwards}
  @keyframes bar{to{transform:scaleY(1)}}
  /* Timeline: F1 0-3.4s | F2 3.2-6.6s | F3 6.6s -> holds */
  #f1{animation:f1 3.4s ease forwards}
  #f2{animation:f2 3.4s 3.2s ease forwards}
  #f3{animation:f3 .6s 6.6s ease forwards}
  @keyframes f1{0%{opacity:0;transform:translateX(-24px)}15%,80%{opacity:1;transform:none}100%{opacity:0;transform:translateX(24px)}}
  @keyframes f2{0%{opacity:0;transform:translateX(-24px)}15%,80%{opacity:1;transform:none}100%{opacity:0;transform:translateX(24px)}}
  @keyframes f3{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  .cta{align-self:flex-start;border-radius:999px;background:var(--accent);color:var(--btn-text);font-weight:800;
       animation:pulse 1.6s 7.6s ease-in-out 3}
  @keyframes pulse{50%{transform:scale(1.07)}}
  #ad:hover .cta{filter:brightness(.92)}

  .frame{flex-direction:row;align-items:center;gap:6px;padding:0 12px;white-space:nowrap;justify-content:flex-start}
  .bar{background:var(--accent)}
  h1{font-size:15px;font-weight:800;letter-spacing:-.3px;line-height:1}
  p{font-size:10.5px;color:var(--muted);line-height:1.1}
  .stat{font-size:15px;font-weight:800;line-height:1}
  .brand{display:flex;align-items:center;gap:6px;flex:none}
  .brand img{height:32px;width:auto;display:block}
  .brand b{font-size:11px;font-weight:800;letter-spacing:1px}
  .txt{display:flex;flex-direction:column;gap:2px;min-width:0}
  #f3 p{color:#d0d0d0}
  #f3 h1{font-size:12px}
  .cta{margin-left:auto;flex:none;padding:5px 10px;font-size:13px;letter-spacing:.5px}
  .url{font-size:10.5px;font-weight:700;color:var(--muted);flex:none}

  /* Respect reduced motion: show the end frame only */
  @media (prefers-reduced-motion:reduce){
    #f1,#f2{display:none}
    #f3{animation:none;opacity:1}
    .cta,.bar{animation:none}
    .bar{transform:none}
  }
</style>
</head>
