<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Career Directory | South African Vacancies</title>
<meta name="description" content="Search featured, government, private-sector, and remote job opportunities across South Africa.">
<style>
  :root {
    --radius: 0.5rem;
    --background: oklch(0.955 0.025 91.5);
    --foreground: oklch(0.335 0.083 166.7);
    --card: oklch(0.99 0.008 91.5);
    --primary: oklch(0.335 0.083 166.7);
    --primary-foreground: oklch(0.955 0.025 91.5);
    --secondary: oklch(0.48 0.105 166.5);
    --secondary-foreground: oklch(0.42 0.08 166.5);
    --muted-foreground: oklch(0.53 0.035 165);
    --border: oklch(0.335 0.083 166.7 / 12%);
    --ring: oklch(0.48 0.105 166.5);
    --highlight: oklch(0.72 0.105 85.4);
    --highlight-foreground: oklch(0.52 0.1 78);
    --shadow-soft: 0 10px 30px color-mix(in oklab, var(--foreground) 7%, transparent);
    --font-heading: "Libre Baskerville", Georgia, serif;
    --font-body: "IBM Plex Sans", Arial, sans-serif;
  }
  * { box-sizing: border-box; border-color: var(--border); }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    background: var(--background);
    color: var(--foreground);
    font-family: var(--font-body);
    -webkit-tap-highlight-color: transparent;
  }
  button { font-family: inherit; letter-spacing: 0; }
  h1, h2, h3 { font-family: var(--font-heading); margin: 0; }
  .sr-only {
    position: absolute; width: 1px; height: 1px;
    padding: 0; margin: -1px; overflow: hidden;
    clip: rect(0,0,0,0); white-space: nowrap; border: 0;
  }
  button:focus-visible, input:focus-visible, a:focus-visible {
    outline: none;
    box-shadow: 0 0 0 3px color-mix(in oklab, var(--ring) 30%, transparent);
  }
  /* Header */
  header {
    position: sticky; top: 0; z-index: 30;
    border-bottom: 1px solid var(--border);
    background: color-mix(in oklab, var(--background) 95%, transparent);
    backdrop-filter: blur(8px);
  }
  .header-grid {
    max-width: 42rem; margin: 0 auto; height: 4rem;
    display: grid; grid-template-columns: 2.75rem minmax(0,1fr) 2.75rem;
    align-items: center; gap: 0.75rem; padding: 0 1rem;
  }
  .header-grid h1 {
    text-align: center; font-size: 1.125rem; font-weight: 700;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .icon-button {
    display: grid; place-items: center; height: 2.75rem; width: 2.75rem;
    border: none; border-radius: 999px; cursor: pointer;
    background: color-mix(in oklab, var(--primary) 7%, transparent);
    transition: transform 160ms ease, background 160ms ease;
  }
  .icon-button svg { height: 1.15rem; width: 1.15rem; }
  .icon-button:active { transform: scale(.94); }
  /* Main */
  main { max-width: 42rem; margin: 0 auto; padding: 1.25rem 1rem 7rem; }
  @media (min-width: 640px) { main, .header-grid { padding-left: 1.5rem; padding-right: 1.5rem; } }
  /* Search */
  .search-wrap { position: relative; margin-bottom: 1rem; }
  .search-wrap svg {
    position: absolute; left: 1rem; top: 50%; transform: translateY(-50%);
    height: 1.25rem; width: 1.25rem; color: var(--muted-foreground); pointer-events: none;
  }
  #vacancy-search {
    height: 3.25rem; width: 100%; border: 1px solid var(--border);
    border-radius: var(--radius); background: var(--card);
    padding: 0 1rem 0 3rem; font-size: 1rem; font-family: inherit;
    color: var(--foreground); outline: none;
    transition: box-shadow 160ms ease, border-color 160ms ease;
  }
  #vacancy-search::placeholder { color: var(--muted-foreground); }
  #vacancy-search:focus { border-color: var(--primary); box-shadow: 0 0 0 3px color-mix(in oklab, var(--ring) 20%, transparent); }
  /* Filter chips */
  .chip-scroller {
    overflow-x: auto; margin: 0 -1rem 2rem; padding: 0 1rem;
    scrollbar-width: none;
  }
  .chip-scroller::-webkit-scrollbar { display: none; }
  @media (min-width: 640px) { .chip-scroller { margin: 0 -1.5rem 2rem; padding: 0 1.5rem; } }
  .chips { display: flex; gap: 0.5rem; width: max-content; }
  .filter-chip {
    min-height: 2.5rem; border: 1px solid var(--border); border-radius: 999px;
    background: color-mix(in oklab, var(--card) 70%, transparent);
    padding: 0.45rem 1rem; color: var(--secondary-foreground);
    font-size: 0.875rem; font-weight: 500; cursor: pointer;
    transition: background 160ms ease, color 160ms ease;
  }
  .filter-chip[aria-pressed="true"] {
    border-color: var(--primary); background: var(--primary); color: var(--primary-foreground);
  }
  /* Featured card */
  .section-title { font-size: 1.125rem; font-weight: 700; margin-bottom: 0.75rem; }
  .featured {
    border: 1px solid var(--border); border-radius: var(--radius);
    background: var(--card); padding: 1.25rem; box-shadow: var(--shadow-soft);
  }
  .featured-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 1rem; margin-bottom: 1rem; }
  .featured-mark {
    height: 3.25rem; width: 3.25rem; flex-shrink: 0; border-radius: var(--radius);
    border: 1px solid var(--border); object-fit: cover;
  }
  .badge {
    border: 1px solid color-mix(in oklab, var(--highlight) 25%, transparent);
    background: color-mix(in oklab, var(--highlight) 10%, transparent);
    border-radius: 999px; padding: 0.25rem 0.625rem;
    font-size: 0.75rem; font-weight: 600; color: var(--highlight-foreground);
  }
  .featured h3 { font-size: 1.25rem; font-weight: 700; line-height: 1.35; }
  .featured-sub { margin: 0.25rem 0 0; font-size: 0.875rem; font-weight: 500; color: var(--secondary-foreground); }
  .featured-foot {
    margin-top: 1.25rem; display: grid; grid-template-columns: minmax(0,1fr) auto;
    align-items: center; gap: 0.75rem;
  }
  .featured-foot span { min-width: 0; font-size: 0.875rem; color: var(--muted-foreground); }
  .primary-action {
    display: inline-flex; min-height: 2.75rem; align-items: center; justify-content: center;
    gap: 0.45rem; border: none; border-radius: var(--radius); background: var(--primary);
    padding: 0.55rem 0.85rem; color: var(--primary-foreground); font-size: 0.875rem;
    font-weight: 600; cursor: pointer; transition: transform 160ms ease;
  }
  .primary-action svg { height: 1rem; width: 1rem; }
  .primary-action:active { transform: scale(.97); }
  /* Stat tiles */
  .tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; }
  .stat-tile {
    display: flex; min-height: 6.5rem; flex-direction: column; align-items: flex-start;
    justify-content: center; gap: 0.35rem; border: 1px solid var(--border);
    border-radius: var(--radius); cursor: pointer; text-align: left;
    background: color-mix(in oklab, var(--secondary) 7%, transparent);
    padding: 1rem; font-family: inherit; color: var(--foreground);
    transition: background 160ms ease, transform 160ms ease;
  }
  .stat-tile:active { transform: scale(.98); background: color-mix(in oklab, var(--secondary) 12%, transparent); }
  .stat-tile .num { font-family: var(--font-heading); font-size: 1.25rem; font-weight: 700; color: var(--highlight-foreground); }
  .stat-tile .lbl { font-size: 0.875rem; font-weight: 600; }
  section + section { margin-top: 2.25rem; }
  /* Listings */
  .listings-head {
    display: grid; grid-template-columns: minmax(0,1fr) auto; align-items: end;
    gap: 0.75rem; border-bottom: 1px solid var(--border); padding-bottom: 0.75rem;
  }
  .listings-head h2 { font-size: 1.125rem; font-weight: 700; min-width: 0; }
  #count { flex-shrink: 0; font-size: 0.875rem; color: var(--muted-foreground); }
  .row {
    display: grid; grid-template-columns: minmax(0,1fr) 2.75rem; gap: 1rem;
    padding: 1.25rem 0; border-bottom: 1px solid var(--border);
  }
  .row:last-child { border-bottom: none; }
  .row-main {
    min-width: 0; text-align: left; background: none; border: none; padding: 0;
    cursor: pointer; color: inherit; font-family: inherit;
  }
  .row-main h3 { font-size: 1rem; font-weight: 700; line-height: 1.35; }
  .row-sub { margin: 0.25rem 0 0; font-size: 0.875rem; font-weight: 500; color: var(--secondary-foreground); }
  .row-meta { margin-top: 0.5rem; display: flex; flex-wrap: wrap; gap: 0.25rem 0.5rem; font-size: 0.75rem; color: var(--muted-foreground); }
  .save-button {
    display: grid; place-items: center; height: 2.75rem; width: 2.75rem;
    border: 1px solid var(--border); border-radius: var(--radius);
    background: var(--card); color: var(--secondary); cursor: pointer;
    transition: background 160ms ease, color 160ms ease;
  }
  .save-button svg { height: 1.25rem; width: 1.25rem; }
  .save-button[aria-pressed="true"] {
    border-color: var(--highlight);
    background: color-mix(in oklab, var(--highlight) 16%, transparent);
    color: var(--highlight-foreground);
  }
  .empty { padding: 3rem 0; text-align: center; }
  .empty p:first-child { font-family: var(--font-heading); font-size: 1rem; font-weight: 700; margin: 0; }
  .empty p:last-child { margin: 0.25rem 0 0; font-size: 0.875rem; color: var(--muted-foreground); }
  /* Bottom nav */
  nav.bottom {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
    border-top: 1px solid var(--border);
    background: color-mix(in oklab, var(--background) 95%, transparent);
    backdrop-filter: blur(8px);
    padding: 0.75rem 0 max(0.75rem, env(safe-area-inset-bottom));
  }
  .nav-grid { display: grid; grid-template-columns: repeat(3, 1fr); max-width: 28rem; margin: 0 auto; padding: 0 2rem; }
  .nav-item {
    display: flex; min-height: 3rem; flex-direction: column; align-items: center;
    justify-content: center; gap: 0.2rem; background: none; border: none; cursor: pointer;
    color: color-mix(in oklab, var(--secondary) 55%, transparent);
    font-size: 0.65rem; font-weight: 600; text-transform: uppercase;
    text-decoration: none; font-family: inherit;
  }
  .nav-item svg { height: 1.25rem; width: 1.25rem; }
  .nav-item[aria-current="page"] { color: var(--foreground); }
  /* Notice toast */
  .notice {
    position: fixed; bottom: 6.25rem; left: 50%; transform: translateX(-50%);
    z-index: 40; display: flex; align-items: center; gap: 0.5rem;
    max-width: calc(100vw - 2rem); border: none; border-radius: var(--radius);
    background: var(--foreground); padding: 0.75rem 1rem; cursor: pointer;
    color: var(--primary-foreground); box-shadow: var(--shadow-soft);
    font-size: 0.8rem; white-space: nowrap; font-family: inherit;
  }
  .notice svg { height: 1rem; width: 1rem; flex-shrink: 0; }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; }
  }
</style>
</head>

  var vacancies = [
    { id: 1, title: "Environmental Consultant", company: "GreenCape", location: "Cape Town, WC", type: "Private Sector", arrangement: "Full-time" },
    { id: 2, title: "Operations Manager", company: "Santam Insurance", location: "Sandton, GP", type: "Remote", arrangement: "Hybrid contract" },
    { id: 3, title: "Clinical Research Associate", company: "Groote Schuur Hospital", location: "Observatory, WC", type: "Government", arrangement: "Permanent" },
    { id: 4, title: "Municipal Finance Officer", company: "eThekwini Municipality", location: "Durban, KZN", type: "Government", arrangement: "Full-time" }
  ];
  var filters = ["All Roles", "Government", "Private Sector", "Remote"];
  var state = { query: "", activeFilter: "All Roles", saved: [] };

  var ICON_BOOKMARK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m19 21-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16z"/></svg>';
  var ICON_ARROW = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)"></svg>';

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function notice(msg) {
    var live = document.getElementById("live");
    live.textContent = msg;
    var old = document.querySelector(".notice");
    if (old) old.remove();
    var btn = document.createElement("button");
    btn.className = "notice";
    btn.setAttribute("aria-label", "Dismiss message");
    btn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 20V7a1 1 0 0 0-1-1H6a1 1 0 0 0-1 1v13"/><path d="M2 20h20"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>' + esc(msg);
    btn.onclick = function () { btn.remove(); };
    document.body.appendChild(btn);
  }

  function renderChips() {
    var wrap = document.getElementById("chips");
    wrap.innerHTML = "";
    filters.forEach(function (f) {
      var b = document.createElement("button");
      b.className = "filter-chip";
      b.textContent = f;
      b.setAttribute("aria-pressed", state.activeFilter === f ? "true" : "false");
      b.onclick = function () { state.activeFilter = f; render(); };
      wrap.appendChild(b);
    });
  }

  function visibleVacancies() {
    var q = state.query.trim().toLowerCase();
    return vacancies.filter(function (v) {
      var matches = state.activeFilter === "All Roles" || v.type === state.activeFilter;
      var searchable = (v.title + " " + v.company + " " + v.location).toLowerCase();
      return matches && searchable.indexOf(q) !== -1;
    });
  }

  function render() {
    renderChips();
    var list = visibleVacancies();
    document.getElementById("count").textContent = list.length + " roles";
    var rows = document.getElementById("rows");
    rows.innerHTML = "";
    list.forEach(function (v) {
      var isSaved = state.saved.indexOf(v.id) !== -1;
      var row = document.createElement("article");
      row.className = "row";
      row.innerHTML =
        '<button class="row-main">' +
          "<h3>" + esc(v.title) + "</h3>" +
          '<p class="row-sub">' + esc(v.company) + " &middot; " + esc(v.location) + "</p>" +
          '<div class="row-meta"><span>' + esc(v.arrangement) + '</span><span aria-hidden="true">&middot;</span><span>' + esc(v.type) + "</span></div>" +
        "</button>" +
        '<button class="save-button" aria-pressed="' + (isSaved ? "true" : "false") + '" aria-label="' + (isSaved ? "Remove" : "Save") + " " + esc(v.title) + '">' +
          (isSaved ? ICON_BOOKMARK.replace("<svg ", '<svg fill="currentColor" ') : ICON_BOOKMARK) +
        "</button>";
      row.querySelector(".row-main").onclick = function () { notice("Opening " + v.title); };
      row.querySelector(".save-button").onclick = function () {
        var i = state.saved.indexOf(v.id);
        if (i === -1) { state.saved.push(v.id); notice(v.title + " saved"); }
        else { state.saved.splice(i, 1); notice(v.title + " removed from saved roles"); }
        render();
      };
      rows.appendChild(row);
    });
    if (list.length === 0) {
      rows.innerHTML = '<div class="empty"><p>No matching roles</p><p>Try another title, company, city, or filter.</p></div>';
    }
    document.getElementById("saved-label").textContent =
      "Saved" + (state.saved.length > 0 ? " (" + state.saved.length + ")" : "");
  }

  document.getElementById("vacancy-search").addEventListener("input", function (e) {
    state.query = e.target.value;
    render();
  });

  document.querySelectorAll(".stat-tile").forEach(function (tile) {
    tile.onclick = function () {
      if (tile.dataset.tile === "learnership") {
        state.activeFilter = "All Roles";
        state.query = "learnership";
        document.getElementById("vacancy-search").value = "learnership";
      } else {
        state.activeFilter = tile.dataset.tile;
      }
      render();
    };
  });

  document.getElementById("share-btn").onclick = function () {
    if (navigator.share) {
      navigator.share({ title: "Career Directory", url: location.href });
    } else if (navigator.clipboard) {
      navigator.clipboard.writeText(location.href);
      notice("Directory link copied");
    }
  };

  document.getElementById("saved-nav").onclick = function () {
    notice(state.saved.length + " saved role" + (state.saved.length === 1 ? "" : "s"));
  };

  render();
</script>
