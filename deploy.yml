name: Build and Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Lets you (or a Supabase webhook) trigger a rebuild manually/remotely
  # without needing a new commit — useful for "new vacancy added" rebuilds.
  workflow_dispatch:

# Allow this workflow to deploy to Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Only one deploy at a time; cancel older in-progress runs if a new one starts
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Generate static agency/vacancy pages + sitemap
        run: node generate-pages.js

      - name: Upload build output as Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # "." because publish = the whole repo root, same as your
          # old netlify.toml "publish = '.'" — index.html, the newly
          # generated /agency /vacancy folders, sitemap.xml etc. all
          # live at repo root.
          path: "."

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
